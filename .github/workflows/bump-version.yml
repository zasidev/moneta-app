name: Bump version on merge

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Branch base su cui fare il bump (default: main)"
        required: false
        default: "main"
      force:
        description: "Esegui bump anche senza PR mergeata"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  bump:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && needs.build.result == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version and compute next patch
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Bump package.json version
        run: |
          npm version ${{ steps.version.outputs.new }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.new }}" || echo "Nothing to commit"

      - name: Create git tag
        run: |
          git tag v${{ steps.version.outputs.new }}

      - name: Push changes and tag
        run: |
          BASE_REF="${{ github.event.inputs.base_ref || github.base_ref }}"
          git push origin HEAD:${BASE_REF}
          git push origin v${{ steps.version.outputs.new }}
